<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Shashank's engineering skills console</title><desc id="desc">Twelve non-interactive glass buttons listing verified AI, web and developer-tool skills.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04080D"/><stop offset=".55" stop-color="#08131E"/><stop offset="1" stop-color="#071720"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D9F7FF" stop-opacity=".11"/><stop offset=".48" stop-color="#173047" stop-opacity=".34"/><stop offset="1" stop-color="#07121C" stop-opacity=".62"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9BDFF0" stroke-opacity=".045"/></pattern><filter id="depth" x="-20%" y="-30%" width="150%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000814" flood-opacity=".42"/></filter></defs>
  <rect width="1200" height="350" rx="18" fill="url(#bg)"/><rect width="1200" height="350" rx="18" fill="url(#grid)"/>
