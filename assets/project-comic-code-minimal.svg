<svg xmlns="http://www.w3.org/2000/svg" width="800" height="112" viewBox="0 0 800 112" role="img" aria-labelledby="title desc">
  <title id="title">Comic Code</title><desc id="desc">Minimal liquid-glass project heading for Comic Code.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAFBFF" stop-opacity=".20"/><stop offset=".42" stop-color="#183149" stop-opacity=".78"/><stop offset="1" stop-color="#251C2B" stop-opacity=".92"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF" stop-opacity=".62"/><stop offset=".55" stop-color="#FFD5E5" stop-opacity=".72"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/></linearGradient>
    <filter id="depth" x="-10%" y="-30%" width="120%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02070C" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="112" rx="16" fill="#07111A"/>
  <g filter="url(#depth)"><rect x="10" y="10" width="780" height="92" rx="15" fill="url(#glass)"/><rect x="10.75" y="10.75" width="778.5" height="90.5" rx="14.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/></g>
  <g font-family="Avenir Next,Segoe UI,ui-sans-serif,sans-serif"><text x="38" y="52" fill="#FCFEFF" font-size="32" font-weight="700">Comic Code</text><text x="38" y="80" fill="#D9EDF5" font-size="21" font-weight="500">Code, explained as a visual story.</text></g>
</svg>
