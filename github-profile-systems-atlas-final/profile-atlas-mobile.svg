<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1180" viewBox="0 0 800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Shashank Thota — animated mobile AI systems profile</title>
  <desc id="desc">A mobile glass systems chamber with an animated name, bio and three stacked project signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04080D"/><stop offset=".55" stop-color="#08131E"/><stop offset="1" stop-color="#071720"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset=".55" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D9F7FF" stop-opacity=".12"/><stop offset=".45" stop-color="#183047" stop-opacity=".34"/><stop offset="1" stop-color="#07121C" stop-opacity=".64"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#ECFEFF"/><stop offset=".24" stop-color="#67E8F9"/><stop offset=".58" stop-color="#4F6EE8"/><stop offset="1" stop-color="#111C2A"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#9BDFF0" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="depth" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".45"/></filter>
    <clipPath id="nameReveal"><rect x="150" y="92" width="0" height="152"><animate attributeName="width" from="0" to="520" begin=".2s" dur="1.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="bioReveal"><rect x="90" y="324" width="0" height="62"><animate attributeName="width" from="0" to="620" begin="1.45s" dur="1.7s" fill="freeze"/></rect></clipPath>
    <style>
      .static-copy{opacity:0}.name-glow{animation:nameGlow 4s ease-in-out infinite}.bio-glow{animation:bioGlow 4s ease-in-out 1s infinite}
      @keyframes nameGlow{0%,34%,100%{opacity:0}12%{opacity:.82}}
      @keyframes bioGlow{0%,34%,100%{opacity:0}12%{opacity:.72}}
      @media(prefers-reduced-motion:reduce){.motion-only{display:none}.static-copy{opacity:1}}
    </style>
  </defs>
  <rect width="800" height="1180" rx="24" fill="url(#bg)"/><rect width="800" height="1180" rx="24" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="400" y="70" text-anchor="middle" fill="#8CA9C0" font-size="18" font-weight="680" letter-spacing="3">AI / ML · AGENTS · PRODUCT SYSTEMS</text>
    <g class="name-copy" text-anchor="middle" fill="#F8FAFC" font-size="68" font-weight="780" letter-spacing="-2"><text x="400" y="158">SHASHANK</text><text x="400" y="224">THOTA</text></g>
    <g class="motion-only name-glow" text-anchor="middle" fill="none" stroke="#67E8F9" stroke-width="1.2" font-size="68" font-weight="780" letter-spacing="-2" filter="url(#glow)"><text x="400" y="158">SHASHANK</text><text x="400" y="224">THOTA</text></g>
    <rect x="166" y="250" width="468" height="3" fill="url(#signal)"/>
    <text class="static-copy" x="400" y="294" text-anchor="middle" fill="#67E8F9" font-size="26" font-weight="700">AI/ML DEVELOPER · SOFTWARE BUILDER</text>
    <g class="motion-only" text-anchor="middle" font-size="26" font-weight="700"><text x="400" y="294" fill="#67E8F9" opacity="0">AI/ML DEVELOPER<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.33;1" dur="12s" repeatCount="indefinite"/></text><text x="400" y="294" fill="#A5B4FC" opacity="0">AGENTIC PRODUCT BUILDER<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.37;.61;.66;1" dur="12s" repeatCount="indefinite"/></text><text x="400" y="294" fill="#D8B4FE" opacity="0">DEVELOPER TOOLS<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.70;.95;1" dur="12s" repeatCount="indefinite"/></text></g>
    <g class="bio-copy" text-anchor="middle" fill="#D8E6F2" font-size="24"><text x="400" y="338">Engineering intelligence into products</text><text x="400" y="370">people can understand and trust.</text></g>
    <g class="motion-only bio-glow" text-anchor="middle" fill="#67E8F9" font-size="24" filter="url(#glow)"><text x="400" y="338">Engineering intelligence into products</text><text x="400" y="370">people can understand and trust.</text></g>

    <g transform="translate(400 486)"><circle r="88" fill="none" stroke="#67E8F9" stroke-opacity=".14"/><circle r="60" fill="none" stroke="#9BDFF0" stroke-opacity=".15"/><circle class="motion-only" r="88" fill="none" stroke="#818CF8" stroke-opacity=".22" stroke-dasharray="4 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/></circle><circle class="motion-only" r="60" fill="none" stroke="#67E8F9" stroke-opacity=".24" stroke-dasharray="22 12"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/></circle><path d="M0-42L38-21V21L0 43L-38 21V-21Z" fill="url(#core)" stroke="#B8F3FF" stroke-opacity=".7" filter="url(#glow)"/><circle r="7" fill="#E6FCFF"/><circle class="motion-only" r="70" fill="none" stroke="#67E8F9" stroke-opacity=".22"><animate attributeName="r" values="70;120" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".22;0" dur="3s" repeatCount="indefinite"/></circle></g>
    <path d="M400 584V1042" fill="none" stroke="#8ECFE1" stroke-opacity=".30" stroke-width="2"/>

    <g filter="url(#depth)">
      <g transform="translate(74 618)"><rect width="652" height="136" rx="16" fill="url(#glass)"/><path d="M18 .5H634" stroke="#D9F7FF" stroke-opacity=".35"/><rect x=".5" y=".5" width="651" height="135" rx="15.5" fill="none" stroke="#67E8F9" stroke-opacity=".42"/><text x="28" y="42" fill="#67E8F9" font-size="22" font-weight="760" letter-spacing="2">EXPLAIN</text><text x="28" y="82" fill="#F8FAFC" font-size="34" font-weight="730">COMIC CODE</text><text x="28" y="113" fill="#AFC7DA" font-size="23">Pull request → grounded four-panel story</text></g>
      <g transform="translate(74 786)"><rect width="652" height="136" rx="16" fill="url(#glass)"/><path d="M18 .5H634" stroke="#D9F7FF" stroke-opacity=".30"/><rect x=".5" y=".5" width="651" height="135" rx="15.5" fill="none" stroke="#818CF8" stroke-opacity=".38"/><text x="28" y="42" fill="#A5B4FC" font-size="22" font-weight="760" letter-spacing="2">PREDICT</text><text x="28" y="82" fill="#F8FAFC" font-size="34" font-weight="730">RISK SIGNALS</text><text x="28" y="113" fill="#AFC7DA" font-size="23">Customer data → operator-reviewed action</text></g>
      <g transform="translate(74 954)"><rect width="652" height="136" rx="16" fill="url(#glass)"/><path d="M18 .5H634" stroke="#FFF4D6" stroke-opacity=".28"/><rect x=".5" y=".5" width="651" height="135" rx="15.5" fill="none" stroke="#F6C76B" stroke-opacity=".38"/><text x="28" y="42" fill="#F6C76B" font-size="22" font-weight="760" letter-spacing="2">CONCEPT</text><text x="28" y="82" fill="#F8FAFC" font-size="34" font-weight="730">NEW LIFE</text><text x="28" y="113" fill="#D9C9A6" font-size="23">Health signal → reminder or doctor escalation</text></g>
    </g>
    <text x="400" y="1144" text-anchor="middle" fill="#7892A8" font-size="18" font-weight="680" letter-spacing="2.3">HYDERABAD, INDIA · BUILDING IN PUBLIC</text>
  </g>
</svg>
