<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Shashank Thota — animated AI systems profile</title>
  <desc id="desc">A cinematic glass systems chamber with an animated name, rotating builder roles and three project signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04080D"/><stop offset="0.55" stop-color="#08131E"/><stop offset="1" stop-color="#071720"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset="0.55" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D9F7FF" stop-opacity="0.12"/><stop offset="0.45" stop-color="#183047" stop-opacity="0.34"/><stop offset="1" stop-color="#07121C" stop-opacity="0.62"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#ECFEFF"/><stop offset="0.24" stop-color="#67E8F9"/><stop offset="0.58" stop-color="#4F6EE8"/><stop offset="1" stop-color="#111C2A"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9BDFF0" stroke-opacity="0.045"/></pattern>
    <filter id="coreGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glassDepth" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000814" flood-opacity="0.45"/></filter>
    <clipPath id="nameReveal"><rect x="58" y="92" width="0" height="152"><animate attributeName="width" from="0" to="560" begin="0.2s" dur="1.35s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/></rect></clipPath>
    <clipPath id="bioReveal"><rect x="62" y="332" width="0" height="32"><animate attributeName="width" from="0" to="650" begin="1.45s" dur="1.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/></rect></clipPath>
    <style>
      .static-copy{opacity:0}.name-glow{animation:nameGlow 4s ease-in-out infinite}.bio-glow{animation:bioGlow 4s ease-in-out 1s infinite}
      @keyframes nameGlow{0%,34%,100%{opacity:0}12%{opacity:.82}}
      @keyframes bioGlow{0%,34%,100%{opacity:0}12%{opacity:.72}}
      @media(prefers-reduced-motion:reduce){.motion-only{display:none}.static-copy{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="500" rx="18" fill="url(#bg)"/><rect width="1200" height="500" rx="18" fill="url(#grid)"/>
  <circle cx="872" cy="236" r="220" fill="#67E8F9" opacity="0.022"/><path d="M0 430C240 350 370 480 590 406S948 352 1200 421" fill="none" stroke="#67E8F9" stroke-opacity="0.09"/>

  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="64" y="68" fill="#8CA9C0" font-size="13" font-weight="680" letter-spacing="3">AI / ML · AGENTS · PRODUCT SYSTEMS</text>
    <g class="name-copy" fill="#F8FAFC" font-size="66" font-weight="780" letter-spacing="-2"><text x="60" y="162">SHASHANK</text><text x="60" y="226">THOTA</text></g>
    <g class="motion-only name-glow" fill="none" stroke="#67E8F9" stroke-width="1.2" font-size="66" font-weight="780" letter-spacing="-2" filter="url(#coreGlow)"><text x="60" y="162">SHASHANK</text><text x="60" y="226">THOTA</text></g>
    <rect x="62" y="250" width="418" height="2" fill="url(#signal)"/>
    <rect class="motion-only" x="58" y="98" width="3" height="142" fill="#D9F7FF" opacity="0"><animate attributeName="x" values="58;590" begin="0.2s" dur="1.35s" fill="freeze"/><animate attributeName="opacity" values="0;0.8;0" begin="0.2s" dur="1.35s" fill="freeze"/></rect>

    <text class="static-copy" x="64" y="292" fill="#67E8F9" font-size="18" font-weight="700">AI/ML DEVELOPER · SOFTWARE BUILDER</text>
    <g class="motion-only" font-size="18" font-weight="700">
      <text x="64" y="292" fill="#67E8F9" opacity="0">AI/ML DEVELOPER<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.28;0.33;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="64" y="292" fill="#A5B4FC" opacity="0">AGENTIC PRODUCT BUILDER<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.61;0.66;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="64" y="292" fill="#D8B4FE" opacity="0">DEVELOPER TOOLS<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.95;1" dur="12s" repeatCount="indefinite"/></text>
    </g>
    <text class="bio-copy" x="64" y="352" fill="#D8E6F2" font-size="17">Engineering intelligence into products people can understand and trust.</text>
    <text class="motion-only bio-glow" x="64" y="352" fill="#67E8F9" font-size="17" filter="url(#coreGlow)">Engineering intelligence into products people can understand and trust.</text>
    <rect class="motion-only" x="64" y="359" width="9" height="2" fill="#67E8F9"><animate attributeName="x" from="64" to="704" begin="1.45s" dur="1.7s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
    <text x="64" y="408" fill="#7892A8" font-size="12" font-weight="680" letter-spacing="2.2">HYDERABAD, INDIA · BUILDING IN PUBLIC</text>

    <g transform="translate(790 242)">
      <circle r="88" fill="none" stroke="#67E8F9" stroke-opacity="0.14"/><circle r="60" fill="none" stroke="#9BDFF0" stroke-opacity="0.15"/>
      <circle class="motion-only" r="88" fill="none" stroke="#818CF8" stroke-opacity="0.22" stroke-dasharray="4 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/></circle>
      <circle class="motion-only" r="60" fill="none" stroke="#67E8F9" stroke-opacity="0.24" stroke-dasharray="22 12"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/></circle>
      <path d="M0-40L36-20V20L0 41L-36 20V-20Z" fill="url(#core)" stroke="#B8F3FF" stroke-opacity="0.7" filter="url(#coreGlow)"/><circle r="6" fill="#E6FCFF"/>
      <circle class="motion-only" r="62" fill="none" stroke="#67E8F9" stroke-opacity="0.22"><animate attributeName="r" values="62;116" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.22;0" dur="3s" repeatCount="indefinite"/></circle>
      <text x="0" y="112" text-anchor="middle" fill="#AFC7DA" font-size="10" font-weight="700" letter-spacing="2">SYSTEM CORE</text>
    </g>

    <g fill="none" stroke="#8ECFE1" stroke-opacity="0.34" stroke-width="1.4"><path id="p1" d="M840 196C900 126 936 106 978 98"/><path id="p2" d="M850 242H978"/><path id="p3" d="M840 288C900 355 936 374 978 382"/></g>
    <g class="motion-only" fill="#E8FCFF" filter="url(#coreGlow)"><circle r="3"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="3"><animateMotion dur="3.7s" begin="-1.3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle r="3"><animateMotion dur="4.6s" begin="-2.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle></g>

    <g filter="url(#glassDepth)">
      <g transform="translate(978 52)"><rect width="194" height="92" rx="14" fill="url(#glass)"/><path d="M14 .5H180" stroke="#D9F7FF" stroke-opacity="0.38"/><rect x=".5" y=".5" width="193" height="91" rx="13.5" fill="none" stroke="#67E8F9" stroke-opacity="0.42"/><text x="18" y="31" fill="#67E8F9" font-size="11" font-weight="760" letter-spacing="1.5">EXPLAIN</text><text x="18" y="58" fill="#F8FAFC" font-size="17" font-weight="730">COMIC CODE</text><text x="18" y="77" fill="#AFC7DA" font-size="10">PR → four-panel story</text></g>
      <g transform="translate(978 196)"><rect width="194" height="92" rx="14" fill="url(#glass)"/><path d="M14 .5H180" stroke="#D9F7FF" stroke-opacity="0.34"/><rect x=".5" y=".5" width="193" height="91" rx="13.5" fill="none" stroke="#818CF8" stroke-opacity="0.38"/><text x="18" y="31" fill="#A5B4FC" font-size="11" font-weight="760" letter-spacing="1.5">PREDICT</text><text x="18" y="58" fill="#F8FAFC" font-size="17" font-weight="730">RISK SIGNALS</text><text x="18" y="77" fill="#AFC7DA" font-size="10">data → reviewed action</text></g>
      <g transform="translate(978 340)"><rect width="194" height="92" rx="14" fill="url(#glass)"/><path d="M14 .5H180" stroke="#FFF4D6" stroke-opacity="0.30"/><rect x=".5" y=".5" width="193" height="91" rx="13.5" fill="none" stroke="#F6C76B" stroke-opacity="0.38"/><text x="18" y="31" fill="#F6C76B" font-size="11" font-weight="760" letter-spacing="1.5">CONCEPT</text><text x="18" y="58" fill="#F8FAFC" font-size="17" font-weight="730">NEW LIFE</text><text x="18" y="77" fill="#D9C9A6" font-size="10">health signal → escalation</text></g>
    </g>
  </g>
</svg>
